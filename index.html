<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AbsensiKu - CV Raja Wangwa Globalindo</title>
<style>
:root{
  --navy:#0f2557; --navy2:#173a85; --blue:#2563eb; --ink:#14213d; --muted:#64748b;
  --bg:#f4f7fd; --line:#e5eaf3; --card:#fff;
  --ok:#15803d; --ok-bg:#dcfce7; --late:#b45309; --late-bg:#fef3c7; --no:#b91c1c; --no-bg:#fee2e2;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- tombol & form ---------- */
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--blue);color:#fff}
.btn:hover{background:#1d4fd8}
.btn:disabled{background:#a9b8d6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f1f5fb}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%;display:flex;justify-content:center;align-items:center;gap:8px}
label.f{display:block;margin-bottom:12px;font-weight:600;font-size:13px;color:#33415c}
label.f textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid #cfd8e8;border-radius:9px;background:#fff;font-weight:400;resize:vertical}
label.f input,label.f select{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid #cfd8e8;border-radius:9px;background:#fff;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:12px}
.chk input{width:18px;height:18px}

/* ---------- login ---------- */
.center{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--navy),var(--navy2))}
.login{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--blue);display:grid;place-items:center;color:#fff}
.brand b{font-size:19px;display:block;letter-spacing:.2px}
.brand small{color:var(--muted);display:block}
.login h1{font-size:20px;margin:22px 0 4px}
.login p{margin:0 0 18px;color:var(--muted)}
.err{background:var(--no-bg);color:var(--no);border-radius:9px;padding:10px 12px;margin-bottom:12px;font-weight:500}

/* ---------- admin ---------- */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.side{background:linear-gradient(180deg,var(--navy),#0b1d47);color:#dbe6ff;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand b{color:#fff}
.side .brand small{color:#9db4e6;font-size:12px}
.nav{margin-top:28px;display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:14px;border:0;background:none;color:#c9d8fb;padding:13px 16px;border-radius:11px;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;display:flex;align-items:center;gap:10px}
.me .av2{width:38px;height:38px;border-radius:50%;background:#9db4e6;color:var(--navy);display:grid;place-items:center;font-weight:700}
.me div{flex:1;min-width:0}
.me b{display:block;color:#fff;font-size:13px}
.me small{color:#9db4e6}
.me button{background:none;border:0;color:#c9d8fb;padding:6px}
.main{padding:26px 30px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}
.top h1{font-size:25px;margin:0 0 4px}
.top p{margin:0;color:var(--muted)}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{border-radius:14px;padding:18px;display:flex;gap:14px;align-items:flex-start;border:1px solid transparent}
.stat .bub{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.stat small{display:block;color:#33415c;font-weight:500}
.stat .n{font-size:32px;font-weight:700;line-height:1.15;margin:2px 0 6px}
.stat .sub{color:var(--muted);font-size:13px}
.stat.s-blue{background:#eef4ff;border-color:#d6e4ff}.s-blue .bub{background:var(--blue)}
.stat.s-green{background:#e9fbf1;border-color:#c8f2d9}.s-green .bub{background:#16a34a}
.stat.s-amber{background:#fff7e0;border-color:#fde7a8}.s-amber .bub{background:#f5b50a}
.stat.s-red{background:#ffecee;border-color:#fcc9cf}.s-red .bub{background:#e5484d}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{font-size:18px;margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{padding:9px 11px;border:1px solid #cfd8e8;border-radius:9px;background:#fff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:#f1f5fb;text-align:left;font-weight:600;color:#33415c;padding:12px 10px;font-size:13px}
th:first-child{border-radius:9px 0 0 9px}th:last-child{border-radius:0 9px 9px 0}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.who{display:flex;align-items:center;gap:10px}
.av{position:relative;width:34px;height:34px;border-radius:50%;background:#dbe6ff;color:var(--navy2);display:grid;place-items:center;font-size:12px;font-weight:700;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st{display:inline-block;padding:4px 10px;border-radius:7px;font-size:12.5px;font-weight:600}
.st.Hadir{background:var(--ok-bg);color:var(--ok)}
.st.Terlambat{background:var(--late-bg);color:var(--late)}
.st.Tidak{background:var(--no-bg);color:var(--no)}
.st.Pulang{background:#e0e7ff;color:#3730a3}
.st.Belum{background:#eef1f6;color:#475569}
.st.Libur{background:#ede9fe;color:#5b21b6}
.st.Sakit{background:#fce7f3;color:#9d174d}
.st.Izin{background:#e0f2fe;color:#075985}
.izr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.izr .sub{font-size:13px}
.note{margin:10px 0 0;text-align:center;color:var(--muted);font-size:13px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:13px;flex-wrap:wrap;gap:8px}
.pager div{display:flex;gap:6px}
.pager button{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px}
.pager button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
.cal h3{margin:0 0 12px;font-size:16px}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calnav button{border:0;background:none;padding:6px 10px;font-size:16px}
.calnav b{font-size:15px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}
.cg span{font-size:12px;color:var(--muted);padding:6px 0}
.cg button{border:0;background:none;border-radius:50%;aspect-ratio:1;font-size:13px;color:var(--ink)}
.cg button:hover{background:#eef4ff}
.cg button.sel{background:var(--blue);color:#fff;font-weight:700}
.cg button.today:not(.sel){box-shadow:inset 0 0 0 1.5px var(--blue)}
.rekap{margin-top:20px}
.rekap .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rekap h3{margin:0;font-size:16px}
.rk{display:grid;grid-template-columns:14px 1fr auto 44px;gap:8px;align-items:center;padding:8px 0;font-size:13px}
.rk i{width:11px;height:11px;border-radius:50%;display:block}
.rk em{font-style:normal;color:var(--muted);text-align:right}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}

/* ---------- jadwal shift ---------- */
.jt select{width:100%;min-width:92px;padding:7px 6px;border:1px solid #cfd8e8;border-radius:8px;background:#fff}
.jt select[data-v="Pagi"]{background:#e9fbf1}
.jt select[data-v="Middle"]{background:#fff7e0}
.jt select[data-v="Sore"]{background:#eef4ff}
.jt select[data-v="Libur"]{background:#ede9fe}
.jt th.hr{background:#dbe6ff}

.lb{display:flex;gap:4px 8px;flex-wrap:wrap;min-width:230px}
.lb label{display:flex;align-items:center;gap:3px;font-size:12px}
.pt select,.pt input[type=date]{width:100%;min-width:84px;padding:7px 6px;border:1px solid #cfd8e8;border-radius:8px;background:#fff}
.otm{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.otm .on{color:var(--ok);font-weight:600}

.rt{display:flex;gap:10px;align-items:center}
.bell{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;align-items:center;color:var(--ink)}
.bell:hover{background:#f1f5fb}
.bd{position:absolute;top:-7px;right:-7px;background:#e5484d;color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center;line-height:16px}
.bd.z{display:none}
.nl{max-height:260px;overflow:auto;margin:10px 0 4px;border-top:1px solid var(--line)}
.nl div{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.nl div.klik{cursor:pointer}
.nl div.klik:hover{background:#f1f5fb}
.nl small{display:block;color:var(--muted)}
.nl small.aksi{color:var(--blue);font-weight:600}

/* ---------- absen karyawan ---------- */
.emp{max-width:480px;margin:0 auto;padding:16px;min-height:100%}
.emp header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.emp header button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 2px;font-size:19px}
.card .sub{color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kv div{background:#f4f7fd;border-radius:10px;padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-size:16px}
.cam{position:relative;background:#0b1d47;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .ph2{position:absolute;inset:0;display:grid;place-items:center;color:#c9d8fb;padding:18px;text-align:center}
.gps{display:flex;gap:10px;align-items:center;margin:12px 0;padding:11px 13px;border-radius:11px;font-weight:600;background:#f1f5fb;color:#33415c}
.gps.ok{background:var(--ok-bg);color:var(--ok)}
.gps.bad{background:var(--no-bg);color:var(--no)}
.done{text-align:center;padding:10px 0}
.done b{font-size:18px;display:block;margin-bottom:4px}

/* ---------- modal & toast ---------- */
.mask{position:fixed;inset:0;background:rgba(10,20,50,.5);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 14px;font-size:19px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 18px;border-radius:11px;z-index:30;max-width:92vw;display:none}
#toast.bad{background:var(--no)}

@media (max-width:1100px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:14px}
  .nav{flex-direction:row;overflow-x:auto;margin-top:14px}
  .nav button{padding:10px 14px;white-space:nowrap}
  .me{display:none}
  .main{padding:18px 14px}
  .top{flex-direction:column}
}
@media (max-width:520px){.stats{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status"></div>

<script>
/* ============================ UTIL ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ============================ GITHUB / APPS SCRIPT API ============================
   Isi URL ini dengan URL Web App Apps Script yang berakhiran /exec.
   Contoh:
   const API_URL = 'https://script.google.com/macros/s/XXXXXXXXXXXX/exec';
*/
const API_URL = 'https://script.google.com/macros/s/AKfycbzCrYnBwsHnW7HqOptrxg1YEyaQt3G3_2Uo56dXIjL_bwJz8KUynDhckDAvQ0CaoV_Plw/exec';

const api = (fn, ...a) => new Promise(async (ok, no) => {
  try {
    if (!API_URL || API_URL.indexOf('GANTI_DENGAN') >= 0) {
      throw new Error('URL Web App Apps Script belum diisi di API_URL.');
    }

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: a }),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timer);
    }

    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error('Respons server tidak valid. Pastikan Web App Apps Script memakai URL /exec dan deployment terbaru.');
    }

    if (!data.ok) throw new Error(String(data.error || 'Terjadi kesalahan di server.'));
    ok(data.data);
  } catch (e) {
    if (e && e.name === 'AbortError') {
      no(new Error('Server terlalu lama merespons. Coba lagi.'));
    } else {
      no(e instanceof Error ? e : new Error(String(e)));
    }
  }
});

const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const pad = n => ('0' + n).slice(-2);
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtTgl = s => { const d = new Date(s + 'T00:00:00'); return HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); };
const initials = n => String(n).split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();

const IC = {
  home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M8 14l3 3 5-6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.5 2.6 3.5 5.5"/>',
  doc:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="14" r="3.5"/>'
};
const ic = (n, c) => '<svg class="ic ' + (c || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + '</svg>';
const LOGO = '<div class="logo" style="background:none"><img src="https://drive.google.com/thumbnail?id=1_yK9ooGDv8gEm3fOTwOVPDK2wbD-NPsU&sz=w128" alt="Logo" style="width:100%;height:100%;border-radius:12px;object-fit:contain"></div>';

let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', bad ? 5500 : 2800);
}

function modal(title, html, onSave, saveLabel) {
  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h2>' + esc(title) + '</h2><div id="mb">' + html +
    '</div><div id="me" class="err" style="display:none"></div><div class="acts"><button class="btn ghost" id="mx">Batal</button>' +
    (onSave ? '<button class="btn" id="ms">' + (saveLabel || 'Simpan') + '</button>' : '') + '</div></div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelector('#mx').onclick = close;
  if (onSave) m.querySelector('#ms').onclick = async () => {
    const b = m.querySelector('#ms'), e = m.querySelector('#me');
    b.disabled = true; e.style.display = 'none';
    try { await onSave(m); close(); }
    catch (er) { e.textContent = er.message; e.style.display = 'block'; b.disabled = false; }
  };
  return m;
}

/* ============================ STATE ============================ */
const S = { token: null, role: null, nama: '', page: 'beranda', tanggal: '', outlet: '', shift: '', data: null, pg: 1,
            cal: null, karyawan: null, outlets: null, lap: null, jwk: '', jo: '', jd: null, dirty: 0 };
let EMP = null, stream = null, watchId = null, POS = null, GPSERR = '';

/* ---------- OPTIMASI NAVIGASI ----------
   Menu langsung menampilkan "Memuat..." tanpa menunggu server.
   Request lama juga tidak boleh menimpa halaman yang baru dipilih.
*/
let NAV_SEQ = 0;
const PAGE_CACHE = Object.create(null);
const PAGE_CACHE_TTL = 30000;

function cacheGet_(key) {
  const x = PAGE_CACHE[key];
  if (!x || Date.now() - x.ts > PAGE_CACHE_TTL) return null;
  return x.data;
}
function cachePut_(key, data) {
  PAGE_CACHE[key] = { ts: Date.now(), data: data };
  return data;
}
function cacheClear_(key) {
  if (key) delete PAGE_CACHE[key];
  else Object.keys(PAGE_CACHE).forEach(k => delete PAGE_CACHE[k]);
}

function pageTitle_(p) {
  const m = {
    beranda: ['Selamat Datang, ' + esc(S.nama), 'Ringkasan aktivitas absensi.'],
    absensi: ['Absensi', 'Status absensi karyawan aktif per tanggal dan outlet.'],
    karyawan: ['Data Karyawan', 'Kelola data karyawan, outlet, dan shift.'],
    jadwal: ['Jadwal Shift', 'Kelola jadwal shift karyawan.'],
    pola: ['Rotasi Otomatis', 'Atur pola rotasi jadwal otomatis.'],
    izin: ['Izin & Sakit', 'Kelola pengajuan izin dan sakit karyawan.'],
    laporan: ['Laporan', 'Unduh data absensi untuk rekap.'],
    pengaturan: ['Pengaturan', 'Kelola outlet dan pengaturan aplikasi.']
  };
  return m[p] || [p, 'Memuat halaman...'];
}

function loadingBody_(p) {
  return '<div class="panel" style="min-height:180px;display:grid;place-items:center">' +
    '<div class="empty" style="margin:0">Memuat ' + esc(pageTitle_(p)[0]) + '...</div></div>';
}

function showLoadingPage_(p) {
  const t = pageTitle_(p);
  shell(t[0], t[1], loadingBody_(p));
}

const haversine = (a, b, c, d) => {
  const R = 6371000, t = x => x * Math.PI / 180, dl = t(c - a), dg = t(d - b);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(dg / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

function startGps(aksi) {
  if (!navigator.geolocation) { GPSERR = 'Browser tidak mendukung lokasi.'; }
  else watchId = navigator.geolocation.watchPosition(p => { POS = p.coords; GPSERR = ''; updGps(); },
    e => { GPSERR = e.code === 1 ? 'Izin lokasi ditolak. Aktifkan lokasi untuk situs ini.' : 'Lokasi belum ditemukan. Pastikan GPS aktif.'; updGps(); },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });

  const tombol = $('#ab'), inp = $('#sf'), label = 'Absen ' + aksi;
  const kirim = async foto => {
    tombol.disabled = true; tombol.textContent = 'Mengirim...';
    try {
      const r = await api('absen', S.token, aksi, POS.latitude, POS.longitude, POS.accuracy, foto);
      toast('Absen ' + r.jenis + ' tercatat pukul ' + r.jam + (r.status === 'Terlambat' ? ' (terlambat)' : r.status === 'Pulang Awal' ? ' (lebih awal dari jam shift)' : ''));
      await viewEmp();
    } catch (e) { toast(e.message, true); tombol.textContent = label; tombol.disabled = false; updGps(); }
  };
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const w = 480, hgt = Math.round(w * img.naturalHeight / img.naturalWidth);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = hgt;
      cv.getContext('2d').drawImage(img, 0, 0, w, hgt);
      URL.revokeObjectURL(url); inp.value = '';
      kirim(cv.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => toast('Foto tidak bisa dibaca. Coba ambil ulang.', true);
    img.src = url;
  };
  tombol.onclick = () => inp.click();
  updGps();
}

function updGps() {
  const box = $('#gps'), tx = $('#gtx'), btn = $('#ab');
  if (!box || !EMP || !EMP.outlet) return;
  const o = EMP.outlet;
  let ok = false;
  if (GPSERR) { box.className = 'gps bad'; tx.textContent = GPSERR; }
  else if (!POS) { box.className = 'gps'; tx.textContent = 'Mencari lokasi...'; }
  else if (o.lat === null) { box.className = 'gps bad'; tx.textContent = 'Titik outlet belum diisi admin.'; }
  else {
    const d = haversine(POS.latitude, POS.longitude, o.lat, o.lng);
    if (d > o.radius) { box.className = 'gps bad'; tx.textContent = 'Anda ' + Math.round(d) + ' m dari outlet. Maksimal ' + o.radius + ' m.'; }
    else if (POS.accuracy > 30) { box.className = 'gps bad'; tx.textContent = 'Sinyal GPS lemah (' + Math.round(POS.accuracy) + ' m). Tunggu sebentar.'; }
    else { box.className = 'gps ok'; tx.textContent = 'Di dalam area outlet (' + Math.round(d) + ' m).'; ok = true; }
  }
  if (btn && btn.textContent.indexOf('Mengirim') < 0) btn.disabled = !ok;
}
setInterval(() => { if (EMP && $('#ab')) updGps(); }, 1500);

  const seq = ++NAV_SEQ;

const senin = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return iso(x); };

function jwGo(n) {

function jwOutlet(v) {

function isiBaris(i, el) {

async function salinLalu() {

function fotoKecil(file, w) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, w / img.naturalWidth), cw = Math.round(img.naturalWidth * sc), ch = Math.round(img.naturalHeight * sc);
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
      cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => no(new Error('Foto tidak bisa dibaca. Coba pilih foto lain.'));
    img.src = url;
  });
}

/* ---------- Notifikasi & suara ---------- */
const NT = { suara: true, absen: true, izin: true, base: false, seenIz: new Set(), absTs: 0, izSt: {}, jd: {}, list: [], unread: 0, last: 0, busy: false };
try { const j = JSON.parse(localStorage.getItem('ntf') || '{}'); ['suara', 'absen', 'izin'].forEach(k => { if (typeof j[k] === 'boolean') NT[k] = j[k]; }); } catch (e) {}
function saveNT() { try { localStorage.setItem('ntf', JSON.stringify({ suara: NT.suara, absen: NT.absen, izin: NT.izin })); } catch (e) {} }
function resetNotif() { NT.base = false; NT.seenIz = new Set(); NT.absTs = 0; NT.izSt = {}; NT.jd = {}; NT.list = []; NT.unread = 0; NT.last = 0; }

let AC = null;
function audio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  return AC;
}
document.addEventListener('click', audio);   // browser hanya mengizinkan suara setelah ada klik/sentuhan

function bunyi(tipe) {
  if (!NT.suara) return;
  const ac = audio();
  if (!ac || ac.state !== 'running') return;
  const t0 = ac.currentTime + 0.02;
  const nada = tipe === 'izin' ? [[784, 0], [988, 0.17], [1319, 0.34]] : [[988, 0]];
  nada.forEach(n => {
    const o = ac.createOscillator(), g = ac.createGain(), t = t0 + n[1];
    o.type = 'sine'; o.frequency.value = n[0];
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.32);
  });
}

async function pollNotif() {
  if (!S.token || !S.role || NT.busy) return;
  const adm = S.role === 'Admin';
  if (!adm && document.hidden) return;                       // karyawan: hemat kuota, cek hanya saat halaman terlihat
  if (Date.now() - NT.last < (adm ? 25000 : 110000)) return;
  NT.busy = true; NT.last = Date.now();
  try { procNotif(await api('cekNotif', S.token)); } catch (e) { /* abaikan, coba lagi nanti */ }
  NT.busy = false;
}
setInterval(pollNotif, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { NT.last = 0; pollNotif(); } });

function procNotif(r) {
  const first = !NT.base;
  let snd = '', baru = false;
  if (r.role === 'Admin') {
    (r.izin || []).forEach(x => {
      if (NT.seenIz.has(x.id)) return;
      NT.seenIz.add(x.id);
      if (!first && NT.izin) { notif('Pengajuan ' + x.jenis + ' baru dari ' + x.nama + ' (' + rngTgl(x.mulai, x.selesai) + ')', 'izin'); snd = 'izin'; }
    });
    // Saat pertama kali dimuat: ingatkan jika masih ada pengajuan yang menunggu persetujuan
    if (first && NT.izin && r.pending > 0) { notif(r.pending + ' pengajuan izin/sakit menunggu persetujuan', 'izin'); snd = 'izin'; }
    (r.absen || []).slice().sort((a, b) => a.ts - b.ts).forEach(a => {
      if (a.ts <= NT.absTs) return;
      NT.absTs = a.ts; baru = true;
      if (!first && NT.absen) { notif(a.nama + ' absen ' + String(a.jenis).toLowerCase() + ' pukul ' + a.jam + (a.status === 'Terlambat' ? ' (terlambat)' : '') + ' - ' + a.outlet); snd = snd || 'absen'; }
    });
    if (baru && !first && (S.page === 'beranda' || S.page === 'absensi')) {
      const a = document.activeElement;
      if (!((a && /INPUT|SELECT/.test(a.tagName)) || document.querySelector('.mask'))) loadDash().catch(() => {});
    }
  } else {
    (r.izin || []).forEach(x => {
      const prev = NT.izSt[x.id];
      if (!first && (x.status === 'Disetujui' || x.status === 'Ditolak') && prev !== x.status && prev !== undefined)
        { notif('Pengajuan ' + x.jenis + ' Anda ' + x.status.toLowerCase() + (x.catatan ? '. Catatan: ' + x.catatan : '')); snd = 'izin'; }
      else if (!first && prev === undefined && x.status === 'Disetujui')
        { notif(x.jenis + ' Anda dicatat dan disetujui oleh admin'); snd = 'izin'; }
      NT.izSt[x.id] = x.status;
    });
    const ubah = [];
    (r.jadwal || []).forEach(j => {
      if (!first && NT.jd[j.tgl] !== undefined && NT.jd[j.tgl] !== j.shift) ubah.push(fmtS(j.tgl).slice(0, 5) + ': ' + NT.jd[j.tgl] + ' ke ' + j.shift);
      NT.jd[j.tgl] = j.shift;
    });
    if (ubah.length) { notif('Jadwal shift Anda berubah (' + ubah.slice(0, 3).join(', ') + ')'); snd = 'izin'; }
  }
  NT.base = true;
  if (snd) bunyi(snd);
}

/* Satu baris per karyawan per tanggal: absen masuk dan pulang digabung */
function pasangLap(rows) {
  const m = {}, order = [];
  rows.forEach(r => {
    const k = r[2] + '|' + r[0];
    if (!m[k]) { m[k] = { tgl: r[0], id: r[2], nama: r[3], divisi: r[4], outlet: r[5], shift: '', masuk: '', stMasuk: '', pulang: '', stPulang: '', jarak: '', fMasuk: '', fPulang: '' }; order.push(k); }
    const x = m[k];
    if (r[11]) x.shift = r[11];
    if (r[6] === 'Masuk') { x.masuk = r[1]; x.stMasuk = r[7]; x.jarak = r[8]; x.fMasuk = r[10]; }
    else { x.pulang = r[1]; x.stPulang = r[7]; x.fPulang = r[10]; }
  });
  return order.map(k => m[k]).sort((a, b) => a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : String(a.nama).localeCompare(String(b.nama)));
}
const mnt = t => t ? parseInt(t.slice(0, 2), 10) * 60 + parseInt(t.slice(3, 5), 10) : null;
const durMnt = x => (x.masuk && x.pulang) ? ((mnt(x.pulang) - mnt(x.masuk) + 1440) % 1440) : null;
const fmtDur = m => m == null ? '-' : Math.floor(m / 60) + 'j ' + pad(m % 60) + 'm';
const clsSt = s => s === 'Hadir' ? 'Hadir' : s === 'Terlambat' ? 'Terlambat' : s === 'Pulang Awal' ? 'Terlambat' : s === 'Pulang' ? 'Pulang' : 'Belum';

async function tampilLap() {
  const out = $('#l_out'); out.innerHTML = '<div class="empty">Memuat...</div>';

    const dari = $('#l_a').value, sampai = $('#l_b').value, os = $('#l_o');
    S.lap = await api('getLaporan', S.token, dari, sampai, os.value);
    S.lapP = pasangLap(S.lap);
    S.lapInfo = { dari: dari, sampai: sampai, outlet: os.value ? os.options[os.selectedIndex].text : 'Semua outlet' };
    $('#l_dl').disabled = !S.lap.length; $('#l_csv').disabled = !S.lap.length;

      '<div class="tw"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Outlet</th><th>Shift</th><th>Masuk</th><th>Status</th><th>Pulang</th><th>Durasi</th></tr></thead><tbody>' +
      P.slice(0, 300).map(x => '<tr><td>' + esc(fmtS(x.tgl)) + '</td><td>' + esc(x.nama) + '</td><td>' + esc(x.outlet) + '</td><td>' + esc(x.shift || '-') + '</td><td>' + esc(x.masuk || '-') +
        '</td><td>' + (x.stMasuk ? '<span class="st ' + clsSt(x.stMasuk) + '">' + esc(x.stMasuk) + '</span>' : '-') + '</td><td>' + esc(x.pulang || '-') +
        (x.stPulang === 'Pulang Awal' ? ' <span class="st Terlambat">Awal</span>' : '') + '</td><td>' + fmtDur(durMnt(x)) + '</td></tr>').join('') +
      '</tbody></table></div>' + (P.length > 300 ? '<div class="pager"><span>Menampilkan 300 dari ' + P.length + ' baris. File unduhan memuat semuanya.</span></div>' : '');
  } catch (e) { out.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}

function muatExcelJS() {
  return new Promise((ok, no) => {
    if (window.ExcelJS) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload = () => window.ExcelJS ? ok() : no(new Error('Pustaka Excel gagal dimuat.'));
    s.onerror = () => no(new Error('Pustaka Excel tidak bisa dimuat. Periksa koneksi internet, atau pakai Unduh CSV.'));
    document.head.appendChild(s);
  });
}

/* Cadangan: CSV dengan pemisah titik koma agar kolom langsung rapi di Excel Indonesia */
function unduhLap() {

  const csv = '\ufeffsep=;\r\n' + [head].concat(rows).map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'absensi_' + S.lapInfo.dari + '_sd_' + S.lapInfo.sampai + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

    '</div><p class="sub" style="margin:12px 0 0;color:var(--muted)">Jam shift sama untuk semua outlet. Terlambat dihitung dari jam mulai shift ditambah toleransi outlet. Pulang sebelum jam selesai ditandai Awal. Siapa yang masuk shift apa diatur di menu Jadwal Shift.</p></div>' +
    '<div class="panel"><div class="ph"><h2>' + o.length + ' outlet</h2><button class="btn sm" onclick="formOutlet()">Tambah outlet</button></div><div class="tw"><table><thead><tr><th>Outlet</th><th>Titik lokasi</th><th>Radius</th><th>Toleransi</th><th>Status</th><th></th></tr></thead><tbody>' +
    o.map((x, i) => '<tr><td>' + esc(x.nama) + '</td><td>' + (typeof x.lat !== 'number' || typeof x.lng !== 'number' ? '<span class="st Tidak">Belum diisi</span>' : x.lat.toFixed(6) + ', ' + x.lng.toFixed(6)) + '</td><td>' + x.radius + ' m</td><td>' + x.toleransi + ' menit</td>' +
      '<td><span class="st ' + (x.aktif ? 'Hadir' : 'Tidak') + '">' + (x.aktif ? 'Aktif' : 'Nonaktif') + '</span></td><td><button class="btn ghost sm" onclick="formOutlet(' + i + ')">Ubah</button></td></tr>').join('') +
    '</tbody></table></div></div>';
  shell('Pengaturan', 'Jam shift, titik lokasi, radius, dan toleransi keterlambatan setiap outlet.', body);
}

function formShift() {
  const f = S.shifts.map(x => '<div class="row2"><label class="f">Shift ' + esc(x.nama) + ' - mulai<input id="s_' + esc(x.nama) + '_a" type="time" value="' + esc(x.mulai) + '"></label>' +
    '<label class="f">Shift ' + esc(x.nama) + ' - selesai<input id="s_' + esc(x.nama) + '_b" type="time" value="' + esc(x.selesai) + '"></label></div>').join('');
  modal('Ubah jam shift', f + '<p class="sub" style="margin:0 0 8px;color:var(--muted)">Jam selesai lebih kecil dari jam mulai berarti shift berakhir keesokan harinya.</p>', async () => {
    const o = {}; S.shifts.forEach(x => o[x.nama] = { mulai: $('#s_' + x.nama + '_a').value, selesai: $('#s_' + x.nama + '_b').value });
    await api('saveShift', S.token, o);
    toast('Jam shift disimpan'); await viewOutlet();
  });
}

function formOutlet(i) {
  const baru = i === undefined;
  const o = baru ? { id: '', nama: '', lat: '', lng: '', radius: 20, toleransi: 10, aktif: true } : S.outlets[i];
  const h = '<label class="f">Nama outlet<input id="o_nm" value="' + esc(o.nama) + '"></label>' +
    '<div class="row2"><label class="f">Latitude<input id="o_la" inputmode="decimal" value="' + (typeof o.lat === 'number' ? o.lat : '') + '"></label>' +
    '<label class="f">Longitude<input id="o_lo" inputmode="decimal" value="' + (typeof o.lng === 'number' ? o.lng : '') + '"></label></div>' +
    '<button type="button" class="btn ghost sm" id="o_gps" style="margin-bottom:14px">Pakai lokasi saya sekarang</button>' +
    '<div class="row2"><label class="f">Radius (meter)<input id="o_rd" type="number" min="5" max="500" value="' + o.radius + '"></label>' +
    '<label class="f">Toleransi terlambat (menit)<input id="o_tl" type="number" min="0" max="180" value="' + o.toleransi + '"></label></div>' +
    '<label class="chk"><input type="checkbox" id="o_ak" ' + (o.aktif ? 'checked' : '') + '>Outlet aktif</label>';
  const m = modal(baru ? 'Tambah outlet' : 'Ubah outlet', h, async () => {
    await api('saveOutlet', S.token, { id: o.id, nama: $('#o_nm').value, lat: $('#o_la').value, lng: $('#o_lo').value, radius: $('#o_rd').value,
      toleransi: $('#o_tl').value, aktif: $('#o_ak').checked });
    toast('Outlet disimpan'); await viewOutlet();
  });
  m.querySelector('#o_gps').onclick = () => {
    if (!navigator.geolocation) return toast('Browser tidak mendukung lokasi.', true);
    navigator.geolocation.getCurrentPosition(p => {
      m.querySelector('#o_la').value = p.coords.latitude.toFixed(6);
      m.querySelector('#o_lo').value = p.coords.longitude.toFixed(6);
      toast('Lokasi terisi (akurasi ' + Math.round(p.coords.accuracy) + ' m)');
    }, () => toast('Lokasi tidak bisa dibaca. Izinkan akses lokasi.', true), { enableHighAccuracy: true, timeout: 20000 });
  };
}

boot();
</script>
</body>
</html>
